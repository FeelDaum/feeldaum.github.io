<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeelDaum</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f8f7;
  --surface: #ffffff;
  --text: #111111;
  --sub: #444444;
  --muted: #888888;
  --light: #bbbbbb;
  --border: #e8e8e6;
  --hover: #f2f2f0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  padding: 80px 24px 48px;
  text-align: center;
  background: var(--surface);
}

.site-name {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -2px;
  color: var(--text);
  margin-bottom: 20px;
}

.tagline {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--muted);
  position: relative;
  display: inline-block;
  padding: 0 24px;
}

.tagline::before,
.tagline::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40px;
  height: 1px;
  background: var(--border);
}
.tagline::before { right: 100%; }
.tagline::after { left: 100%; }

/* ── NAV ── */
nav {
  display: flex;
  justify-content: center;
  align-items: stretch;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav-link {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  cursor: pointer;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: inherit;
}

.nav-link:hover,
.nav-link.active {
  color: var(--text);
  border-bottom-color: var(--text);
}

/* DROPDOWN */
.dropdown { position: relative; }

.nav-caret {
  margin-left: 6px;
  font-size: 8px;
  transition: transform 0.2s;
}

.dropdown-panel {
  position: absolute;
  top: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  min-width: 220px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.06);
  padding: 8px 0;
  opacity: 0;
  visibility: hidden;
  transition: all 0.15s ease;
}

.dropdown:hover .dropdown-panel {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

.dropdown:hover .nav-caret {
  transform: rotate(180deg);
}

.dd-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--sub);
  text-decoration: none;
  transition: all 0.12s;
  cursor: pointer;
}

.dd-item:hover {
  background: var(--hover);
  color: var(--text);
}

.dd-code {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--light);
}

/* ── MAIN ── */
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 56px 24px 140px;
}

.section-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--light);
  margin-bottom: 20px;
  padding-left: 2px;
}

/* STOCK GROUP */
.stock-group {
  margin-bottom: 12px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: opacity 0.2s;
}

.stock-group.hidden {
  display: none;
}

.stock-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.stock-header h3 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.stock-header .code {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--light);
}

.stock-header .count {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 20px;
}

/* ARTICLE ROW */
.article-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  text-decoration: none;
  color: var(--text);
  transition: background 0.12s;
  border-bottom: 1px solid var(--border);
}

.article-row:last-child { border-bottom: none; }
.article-row:hover { background: var(--hover); }

.article-date {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--light);
  min-width: 90px;
  flex-shrink: 0;
}

.article-info { flex: 1; }

.article-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 2px;
}

.article-desc {
  font-size: 13px;
  color: var(--muted);
  font-weight: 300;
}

.article-go {
  font-size: 14px;
  color: var(--light);
  flex-shrink: 0;
  transition: all 0.2s;
}

.article-row:hover .article-go {
  transform: translateX(3px);
  color: var(--text);
}

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 32px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

footer p {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--light);
}

footer a {
  color: var(--muted);
  text-decoration: none;
  transition: color 0.15s;
}

footer a:hover { color: var(--text); }

/* ── MOBILE ── */
@media (max-width: 640px) {
  header { padding: 56px 20px 36px; }
  .site-name { font-size: 36px; }
  .tagline { font-size: 12px; letter-spacing: 5px; }
  .tagline::before, .tagline::after { width: 24px; }
  .nav-link { padding: 14px 16px; font-size: 12px; letter-spacing: 1px; }
  .dropdown-panel { left: 0; transform: translateY(4px); }
  .dropdown:hover .dropdown-panel { transform: translateY(0); }
  .article-row { padding: 14px 18px; flex-wrap: wrap; gap: 4px; }
  .article-date { width: 100%; min-width: auto; }
  .stock-header { padding: 14px 18px; }
}
</style>
</head>
<body>

<header>
  <h1 class="site-name">FeelDaum</h1>
  <p class="tagline">Everything in the Universe</p>
</header>

<nav>
  <a href="#" class="nav-link active" onclick="filterStock('all'); return false;">전체</a>
  <div class="dropdown">
    <button class="nav-link">종목 메뉴 <span class="nav-caret">▾</span></button>
    <div class="dropdown-panel">
      <a class="dd-item" onclick="filterStock('meritz'); return false;">
        메리츠금융지주 <span class="dd-code">138040</span>
      </a>
      <a class="dd-item" onclick="filterStock('korean-re'); return false;">
        코리안리 <span class="dd-code">003690</span>
      </a>
    </div>
  </div>
</nav>

<main>

  <p class="section-title" id="section-label">전체</p>

  <div class="stock-group" data-stock="meritz" id="meritz">
    <div class="stock-header">
      <h3>메리츠금융지주</h3>
      <span class="code">138040</span>
      <span class="count">1건</span>
    </div>
    <a href="./invest/meritz/meriz_20260516.html" class="article-row">
      <span class="article-date">2026.05.16</span>
      <div class="article-info">
        <div class="article-title">5-Pillar 투자분석</div>
        <div class="article-desc">Q1 2026 실적 반영 · 종합 투자 판단</div>
      </div>
      <span class="article-go">→</span>
    </a>
  </div>

  <div class="stock-group" data-stock="korean-re" id="korean-re">
    <div class="stock-header">
      <h3>코리안리</h3>
      <span class="code">003690</span>
      <span class="count">1건</span>
    </div>
    <a href="./invest/korean-re/koreanRE_20260516.html" class="article-row">
      <span class="article-date">2026.05.15</span>
      <div class="article-info">
        <div class="article-title">투자 분석 보고서</div>
        <div class="article-desc">국내 유일 전업 재보험사 · 1분기 어닝 서프라이즈 · Conditional Buy</div>
      </div>
      <span class="article-go">→</span>
    </a>
  </div>

  <!--
  새 종목 추가 시 아래 형식으로 (data-stock은 고유 키):

  <div class="stock-group" data-stock="samsung" id="samsung">
    <div class="stock-header">
      <h3>삼성전자</h3>
      <span class="code">005930</span>
      <span class="count">1건</span>
    </div>
    <a href="./invest/others/samsung_20260601.html" class="article-row">
      <span class="article-date">2026.06.01</span>
      <div class="article-info">
        <div class="article-title">분석 제목</div>
        <div class="article-desc">간단 설명</div>
      </div>
      <span class="article-go">→</span>
    </a>
  </div>

  종목 메뉴 드롭다운에 추가하려면 dropdown-panel 안에:
  <a class="dd-item" onclick="filterStock('samsung'); return false;">
    삼성전자 <span class="dd-code">005930</span>
  </a>
  -->

</main>

<footer>
  <p><a href="https://github.com/FeelDaum">GitHub</a> &nbsp;·&nbsp; FeelDaum © 2026</p>
</footer>

<script>
  const names = {
    'meritz': '메리츠금융지주',
    'korean-re': '코리안리'
  };

  function filterStock(key) {
    const groups = document.querySelectorAll('.stock-group');
    const label = document.getElementById('section-label');
    const navAll = document.querySelector('nav .nav-link');

    if (key === 'all') {
      groups.forEach(g => g.classList.remove('hidden'));
      label.textContent = '전체';
      navAll.classList.add('active');
    } else {
      groups.forEach(g => {
        g.dataset.stock === key
          ? g.classList.remove('hidden')
          : g.classList.add('hidden');
      });
      label.textContent = names[key] || key;
      navAll.classList.remove('active');
    }
  }
</script>

</body>
</html>
