<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeelDaum</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --light: #9ca3af;
  --border: #e5e7eb;
  --hover: #f3f4f6;
  --gold: #b8960c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HERO */
header {
  padding: 72px 24px 56px;
  text-align: center;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.site-name {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 28px;
  color: var(--text);
}

.tagline-wrap {
  position: relative;
  display: inline-block;
  padding: 0 20px;
}

.tagline-wrap::before,
.tagline-wrap::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold));
}

.tagline-wrap::before { right: 100%; }
.tagline-wrap::after { left: 100%; background: linear-gradient(to left, transparent, var(--gold)); }

.tagline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 32px);
  font-style: italic;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 2px;
  line-height: 1.6;
}

.tagline-sub {
  margin-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--light);
  text-transform: uppercase;
}

/* NAV */
nav {
  display: flex;
  justify-content: center;
  gap: 32px;
  padding: 18px 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

nav a {
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 1px;
  padding: 4px 0;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

nav a:hover, nav a.active {
  color: var(--text);
  border-bottom-color: var(--text);
}

/* MAIN */
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 48px 24px 120px;
}

.section { margin-bottom: 48px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.section-icon { font-size: 18px; }

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text);
  text-transform: uppercase;
}

.section-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--light);
  margin-left: auto;
}

/* STOCK GROUP */
.stock-group { margin-bottom: 16px; }

.stock-name {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px 10px 0 0;
  border-bottom: none;
}

.stock-name h3 { font-size: 15px; font-weight: 700; }

.stock-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--light);
}

.stock-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
  background: var(--hover);
  color: var(--muted);
}

/* ARTICLE LIST */
.article-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 0 0 10px 10px;
  overflow: hidden;
}

.article-list.standalone { border-radius: 10px; }

.article-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  transition: background 0.15s;
}

.article-item:hover { background: var(--hover); }

.article-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--light);
  min-width: 96px;
  flex-shrink: 0;
}

.article-body { flex: 1; }

.article-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 3px;
  line-height: 1.4;
}

.article-excerpt {
  font-size: 13px;
  color: var(--muted);
  font-weight: 300;
}

.article-arrow {
  color: var(--light);
  font-size: 16px;
  flex-shrink: 0;
  transition: transform 0.2s;
}

.article-item:hover .article-arrow {
  transform: translateX(4px);
  color: var(--text);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 40px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

footer p { font-size: 13px; color: var(--light); }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--text); }

@media (max-width: 640px) {
  header { padding: 48px 20px 40px; }
  .tagline-wrap::before, .tagline-wrap::after { width: 30px; }
  nav { gap: 18px; padding: 14px 20px; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .article-item { padding: 16px 18px; flex-wrap: wrap; gap: 6px; }
  .article-date { min-width: auto; width: 100%; }
  .stock-name { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <h1 class="site-name">FeelDaum</h1>
  <div class="tagline-wrap">
    <p class="tagline">Everything in the universe</p>
  </div>
  <p class="tagline-sub">feeldaum.github.io</p>
</header>

<nav>
  <a href="#" class="active">전체</a>

  <div class="section" id="focus">

      </div>

        <a href="./analysis/meritz/138040-meritz-2026-05-16.html" class="article-item">

    <div class="stock-group">

        <span class="stock-code">003690</span>
        <span class="stock-badge">1건</span>
      </div>
      <div class="article-list">
        <a href="./analysis/korean-re/003690-korean-re-2026-05-15.html" class="article-item">
          <span class="article-date">2026.05.15</span>
          <div class="article-body">

            <div class="article-excerpt">국내 유일 전업 재보험사 · 1분기 어닝 서프라이즈 · Conditional Buy</div>
          </div>

  </div>

  <!-- 개별 분석 -->
  <div class="section" id="others">
    <div class="section-header">
      <span class="section-icon">📋</span>
      <span class="section-label">개별 분석</span>
      <span class="section-count">아직 글이 없습니다</span>
    </div>

    <!--
    글 추가 시 아래 형식으로:

    <div class="article-list standalone">
      <a href="./analysis/others/005930-samsung-elec-2026-06-01.html" class="article-item">
        <span class="article-date">2026.06.01</span>
        <div class="article-body">
          <div class="article-title">삼성전자 (005930) — 분석 제목</div>
          <div class="article-excerpt">간단 설명</div>
        </div>
        <span class="article-arrow">→</span>
      </a>
    </div>
    -->
  </div>

</main>

<footer>
  <p><a href="https://github.com/FeelDaum">GitHub</a> · FeelDaum © 2026</p>
</footer>

</body>
</html>
